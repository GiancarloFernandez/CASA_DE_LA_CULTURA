<head>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="images/logo.png" alt="Logo Casa de la Cultura" onerror="this.style.display='none'">
      Casa de la Cultura
    </a>
    <div class="links">
      <a href="index.html">Inicio</a>
      <a href="galeria.html" class="active">Galería</a>
      <a href="eventos.html">Eventos</a>
      <a href="catalogo.html">Catálogo</a>
    </div>
  </nav>

  <main class="page-main">
    <div class="wrap">
      <div class="section-strip">
        <span class="section-name">Galería</span>
      </div>
      <div class="gallery-page-grid" id="galleryGrid"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div>
      <h3>Casa de la Cultura de Puno</h3>
      <p>Jr. Lima 552, Puno, Perú</p>
      <p>info@casaculturapuno.pe</p>
      <div class="social-icons">
        <a href="#" aria-label="Facebook">FB</a>
        <a href="#" aria-label="Instagram">IG</a>
        <a href="#" aria-label="X">X</a>
      </div>
    </div>
    <div>
      <h3>Secciones</h3>
      <p><a href="index.html">Inicio</a></p>
      <p><a href="galeria.html">Galería</a></p>
      <p><a href="eventos.html">Eventos</a></p>
      <p><a href="catalogo.html">Catálogo</a></p>
    </div>
    <div class="footer-map">
      <h3>Ubicación</h3>
      <iframe loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=-70.0240%2C-15.8405%2C-70.0195%2C-15.8375&layer=mapnik&marker=-15.8390%2C-70.0217"></iframe>
    </div>
  </footer>

<script src="site.js"></script>
<script>
  const GALLERY_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSLxK3_nIDLCn-BJCDthwXL0YrfSnFiNsG7FBvwZP4dY9wcXPxCeGqE2opAXDwSsw/pub?gid=1365614826&single=true&output=csv";

  async function renderGallery() {
    const grid = document.getElementById("galleryGrid");
    if (!GALLERY_CSV_URL) {
      grid.innerHTML = '<div class="empty">Todavía no hay fotos publicadas.</div>';
      return;
    }
    try {
      const rows = await fetchCSV(GALLERY_CSV_URL);
      if (rows.length === 0) {
        grid.innerHTML = '<div class="empty">Todavía no hay fotos publicadas.</div>';
        return;
      }
      grid.innerHTML = rows.map(g => `
        <figure>
          <img src="${driveImageUrl(g.imagen)}" alt="${g.titulo || 'Foto de exposición'}" onerror="this.parentElement.style.display='none'">
          ${g.titulo ? `<figcaption>${g.titulo}</figcaption>` : ""}
        </figure>
      `).join("");
    } catch {
      grid.innerHTML = '<div class="empty">No se pudieron cargar las fotos. Intenta de nuevo más tarde.</div>';
    }
  }

  renderGallery();
</script>
</body>
</html>
