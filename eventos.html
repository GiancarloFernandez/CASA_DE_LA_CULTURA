<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eventos — Casa de la Cultura de Puno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="images/logo.png" alt="Logo Casa de la Cultura" onerror="this.style.display='none'">
      Casa de la Cultura
    </a>
    <div class="links">
      <a href="index.html">Inicio</a>
      <a href="galeria.html">Galería</a>
      <a href="eventos.html" class="active">Eventos</a>
      <a href="catalogo.html">Catálogo</a>
    </div>
  </nav>

  <main class="page-main">
    <div class="wrap">
      <div class="section-strip">
        <span class="section-name">Eventos</span>
        <span class="count" id="eventCount">— eventos</span>
      </div>

      <div class="month-year-filter">
        <select id="monthSelect"></select>
        <select id="yearSelect"></select>
      </div>

      <div class="event-layout">
        <div id="filters"></div>
        <div id="eventList"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div>
      <h3>Casa de la Cultura de Puno</h3>
      <p>Jr. Lima 552, Puno, Perú</p>
      <p>info@casaculturapuno.pe</p>
      <div class="social-icons">
        <a href="#" aria-label="Facebook">FB</a>
        <a href="#" aria-label="Instagram">IG</a>
        <a href="#" aria-label="X">X</a>
      </div>
    </div>
    <div>
      <h3>Secciones</h3>
      <p><a href="index.html">Inicio</a></p>
      <p><a href="galeria.html">Galería</a></p>
      <p><a href="eventos.html">Eventos</a></p>
      <p><a href="catalogo.html">Catálogo</a></p>
    </div>
    <div class="footer-map">
      <h3>Ubicación</h3>
      <iframe loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=-70.0240%2C-15.8405%2C-70.0195%2C-15.8375&layer=mapnik&marker=-15.8390%2C-70.0217"></iframe>
    </div>
  </footer>

<script src="site.js"></script>
<script>
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSd42fnxAbMok3XfA0Eau6szY1MoouiVdgLM2raGuWBUgWXg_EvxY2NZPwKjISfFg/pub?gid=2114634617&single=true&output=csv";
  const CATEGORIES = ["Todos", "Música", "Danza", "Teatro", "Exposición", "Taller", "Cultura", "Conferencias", "Conversatorio"];
  const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

  let activeFilter = "Todos";
  let activeMonth = new Date().getMonth();
  let activeYear = new Date().getFullYear();
  let events = [];

  function renderFilters() {
    const el = document.getElementById("filters");
    el.innerHTML = CATEGORIES.map(cat =>
      `<button class="category-filter${cat === activeFilter ? " active" : ""}" data-cat="${cat}">${cat}</button>`
    ).join("");
    el.querySelectorAll(".category-filter").forEach(btn => {
      btn.onclick = () => { activeFilter = btn.getAttribute("data-cat"); renderFilters(); renderEvents(); };
    });
  }

  function renderMonthYearSelects() {
    const years = [...new Set(events.map(e => e.fecha.slice(0, 4)))].sort();
    const monthSelect = document.getElementById("monthSelect");
    const yearSelect = document.getElementById("yearSelect");

    monthSelect.innerHTML = `<option value="-1">Todos los meses</option>` +
      MESES.map((m, i) => `<option value="${i}">${m.charAt(0).toUpperCase() + m.slice(1)}</option>`).join("");
    monthSelect.value = activeMonth;

    yearSelect.innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join("");
    yearSelect.value = String(activeYear);

    monthSelect.onchange = () => { activeMonth = parseInt(monthSelect.value, 10); renderEvents(); };
    yearSelect.onchange = () => { activeYear = parseInt(yearSelect.value, 10); renderEvents(); };
  }

  function renderEvents() {
    const list = document.getElementById("eventList");
    let filtered = events.filter(e => {
      const [y, m] = e.fecha.split("-");
      const matchesYear = parseInt(y, 10) === activeYear;
      const matchesMonth = activeMonth === -1 || parseInt(m, 10) - 1 === activeMonth;
      const matchesCat = activeFilter === "Todos" || e.categoria === activeFilter;
      return matchesYear && matchesMonth && matchesCat;
    });

    document.getElementById("eventCount").textContent = filtered.length + (filtered.length === 1 ? " evento" : " eventos");

    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty">No hay eventos con estos filtros.</div>';
      return;
    }

    list.innerHTML = filtered.map(e => `
      <div class="event">
        <div class="date-block">
          <div class="day-num">${e.fecha.split("-")[2]}</div>
          <div class="day-abbr">${e.dia_abbr}</div>
        </div>
        <div>
          <div class="event-top">
            <p class="event-title">${e.titulo}</p>
            <span class="tag tag-${e.categoria}">${e.categoria}</span>
          </div>
          <div class="meta">${e.lugar}</div>
          <div class="desc">${e.imagen ? `<img src="${driveImageUrl(e.imagen)}" alt="${e.titulo}">` : ""}<p>${e.desc}</p></div>
        </div>
      </div>
    `).join("");

    list.querySelectorAll(".event").forEach(row => {
      row.addEventListener("click", () => row.classList.toggle("open"));
    });
  }

  fetchCSV(SHEET_CSV_URL)
    .then(rows => {
      events = rows.sort((a, b) => a.fecha.localeCompare(b.fecha));
      renderFilters();
      renderMonthYearSelects();
      renderEvents();
    })
    .catch(() => {
      document.getElementById("eventList").innerHTML = '<div class="empty">No se pudieron cargar los eventos. Intenta de nuevo más tarde.</div>';
    });
</script>
</body>
</html>
