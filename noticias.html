<body>

  <nav class="navbar">
    <a class="brand" href="index.html">Casa de la Cultura</a>
    <div class="links">
      <a href="index.html">Inicio</a>
      <a href="noticias.html" class="active">Noticias</a>
      <a href="eventos.html">Eventos</a>
    </div>
  </nav>

  <main class="page-main">
    <div class="wrap">
      <div class="section-strip">
        <span class="section-name">Noticias</span>
      </div>
      <div class="news-grid" id="newsGrid"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div>
      <h3>Casa de la Cultura de Puno</h3>
      <p>Jr. Lima 552, Puno, Perú</p>
      <p>info@casaculturapuno.pe</p>
      <div class="social-icons">
        <a href="https://www.facebook.com/casadelaculturapuno" aria-label="Facebook">FB</a>
        <a href="https://www.instagram.com/explore/locations/436755260/casa-de-la-cultura-puno/" aria-label="Instagram">IG</a>
        <a href="https://www.tiktok.com/@casa.de.la.cultura.puno?is_from_webapp=1&sender_device=pc" aria-label="TikTok">T</a>

    </div>
    <div>
      <h3>Secciones</h3>
      <p><a href="index.html">Inicio</a></p>
      <p><a href="noticias.html">Noticias</a></p>
      <p><a href="eventos.html">Eventos</a></p>
    </div>
    <div class="footer-map">
      <h3>Ubicación</h3>
      <iframe loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=-70.0240%2C-15.8405%2C-70.0195%2C-15.8375&layer=mapnik&marker=-15.8390%2C-70.0217"></iframe>
    </div>
  </footer>

<script src="site.js"></script>
<script>
  const NEWS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRKu7_E2oeBoKaqPBX1MTkw4FYXNa19TNlgH8HWqiySwgqtzEvXOXAxR2PjE8lB1w/pub?gid=295867473&single=true&output=csv";

  async function renderNews() {
    const grid = document.getElementById("newsGrid");
    if (!NEWS_CSV_URL) {
      grid.innerHTML = '<div class="empty">Todavía no hay noticias publicadas.</div>';
      return;
    }
    try {
      const rows = await fetchCSV(NEWS_CSV_URL);
      if (rows.length === 0) {
        grid.innerHTML = '<div class="empty">Todavía no hay noticias publicadas.</div>';
        return;
      }
      grid.innerHTML = rows.map(n => `
        <div class="news-card">
          ${n.imagen ? `<img src="${n.imagen}" alt="${n.titulo}">` : ""}
          <div class="news-body">
            <div class="news-date">${n.fecha}</div>
            <p class="news-title">${n.titulo}</p>
            <p class="news-summary">${n.resumen}</p>
            ${n.enlace ? `<a class="news-link" href="${n.enlace}" target="_blank" rel="noopener">Leer más →</a>` : ""}
          </div>
        </div>
      `).join("");
    } catch {
      grid.innerHTML = '<div class="empty">No se pudieron cargar las noticias. Intenta de nuevo más tarde.</div>';
    }
  }

  renderNews();
</script>
</body>
</html>
